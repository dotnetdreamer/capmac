name: Publish CLI to npm

# desktop.yml dispatches this workflow on the release tag after publishing.
# It can also be dispatched manually on the default branch or a stable vX.Y.Z tag.
# On the default branch, a version npm already has is bumped first: the bump is
# committed and tagged like a release, without a GitHub release or new Studio build.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version increment when npm already has this version (default branch only)'
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: capmac-npm-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'dotnetdreamer/capmac'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      bumped: ${{ steps.bump.outputs.bumped }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate the version and ref
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const cli = read('packages/cli/package.json');
          const version = cli.version;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error(`Expected a stable X.Y.Z CLI version, got ${version}`);
          }
          const allowedRefs = [`refs/heads/${process.env.DEFAULT_BRANCH}`, `refs/tags/v${version}`];
          if (!allowedRefs.includes(process.env.GITHUB_REF)) {
            throw new Error(`Publish from the default branch or the matching v${version} tag.`);
          }
          for (const path of ['package.json', 'packages/core/package.json', 'apps/desktop/package.json', 'services/signal/package.json']) {
            const pkg = read(path);
            if (pkg.version !== version) throw new Error(`${path} does not match CLI version ${version}`);
            if (pkg.devDependencies?.['@capmac/core'] && pkg.devDependencies['@capmac/core'] !== version) {
              throw new Error(`${path} has a mismatched @capmac/core version`);
            }
          }
          if (cli.devDependencies['@capmac/core'] !== version) throw new Error('CLI has a mismatched @capmac/core version');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      # Staged only in this checkout; the tag job commits it once the build passes.
      - name: Bump a version npm already has
        id: bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUMP: ${{ inputs.bump || 'patch' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version=$VERSION
          bumped=false
          if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" && "$(npm view "capmac@$version" version 2>/dev/null || true)" == "$version" ]]; then
            version=$(node scripts/set-version.mjs "$BUMP")
            if [[ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]]; then
              echo "Tag v$version already exists. Release it from that tag, or bump the default branch past it." >&2
              exit 1
            fi
            bumped=true
            echo "npm already has capmac@$VERSION, so this run publishes $version." >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "version=$version"
            echo "bumped=$bumped"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - run: npm ci

      - run: npm run build
        env:
          CAPMAC_DEFAULT_SIGNAL_URL: ${{ vars.CAPMAC_DEFAULT_SIGNAL_URL }}

      - name: Smoke test the built CLI
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          [[ "$(node packages/cli/bin/capmac.js --version)" == "$VERSION" ]] || { echo 'Built CLI version does not match.' >&2; exit 1; }
          node packages/cli/bin/capmac.js --help

      - name: Pack the built CLI
        working-directory: packages/cli
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"

      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          overwrite: true
          path: ${{ runner.temp }}/package/*.tgz
          archive: true
          if-no-files-found: error
          retention-days: 1

  # Pushed before publishing: if the publish then fails, the next run on the
  # default branch finds the new version missing from npm and publishes it.
  tag:
    needs: build
    if: needs.build.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Commit and tag the version
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          node scripts/set-version.mjs "$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json packages/core/package.json packages/cli/package.json apps/desktop/package.json apps/vscode/package.json services/signal/package.json
          git commit -m "release: v$VERSION (CLI)"
          git tag -a "v$VERSION" -m "CapMac CLI v$VERSION"
          # Also rejects a branch that changed while the build was running.
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/v$VERSION"

  publish:
    needs: [build, tag]
    # Runs when the tag job was skipped (nothing to bump), never after a skipped build (forks).
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.tag.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-tarball
          path: package

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # No checkout, install or project scripts in the job with publish rights.
      # npm tries trusted publishing first; NPM_TOKEN is a first-publish fallback.
      # A release tag can arrive after a default-branch run already published its version.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [[ "$(npm view "capmac@$VERSION" version 2>/dev/null || true)" == "$VERSION" ]]; then
            echo "npm already has capmac@$VERSION; nothing to publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm publish ./package/*.tgz --provenance --access public
          {
            echo "Published capmac@$VERSION to npm."
            echo
            echo "Install with: npm install -g capmac@$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
