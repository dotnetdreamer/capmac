<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CapMac screen</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #16181d; --muted: #6b7280; --border: #e3e5ea;
    --accent: #3a7afe; --ok: #1f9d55; --warn: #c27c0e; --err: #d64545; --device: #101114; --shadow: 0 20px 50px rgba(15,23,42,.18);
    --titlebar: #e8e8ea; --titletext: #3b3d42;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0f12; --panel: #17191e; --text: #e8eaee; --muted: #8b93a1; --border: #262a31;
      --accent: #6b9bff; --ok: #3fbf7f; --warn: #e0a43a; --err: #f06b6b; --device: #000; --shadow: 0 20px 60px rgba(0,0,0,.55);
      --titlebar: #2b2c30; --titletext: #c9cbd1;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0f12; --panel: #17191e; --text: #e8eaee; --muted: #8b93a1; --border: #262a31;
    --accent: #6b9bff; --ok: #3fbf7f; --warn: #e0a43a; --err: #f06b6b; --device: #000; --shadow: 0 20px 60px rgba(0,0,0,.55);
    --titlebar: #2b2c30; --titletext: #c9cbd1;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
  .dot.err { background: var(--err); }
  .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .spacer { flex: 1; }
  button, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  button:hover, select:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  select { max-width: 220px; }
  [hidden] { display: none !important; }
  main { flex: 1; display: flex; min-height: 0; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; min-width: 0; position: relative; }
  .device { background: var(--device); padding: 12px; border-radius: 46px; box-shadow: var(--shadow); height: 100%; max-height: 900px; aspect-ratio: var(--ratio, 0.4615); display: flex; flex-direction: column; }
  .screen { position: relative; flex: 1; border-radius: 36px; overflow: hidden; background: #000; outline: none; }
  .screen:focus-visible { box-shadow: 0 0 0 3px var(--accent); }
  .screen img { width: 100%; height: 100%; object-fit: contain; display: block; user-select: none; -webkit-user-drag: none; touch-action: none; }
  .screen canvas { width: 100%; height: 100%; display: block; }
  .screen.input img { cursor: pointer; }
  /* A Mac app's window: a title bar with the traffic lights above the page. */
  .titlebar { display: none; height: 28px; flex: none; align-items: center; gap: 8px; padding: 0 10px; background: var(--titlebar); color: var(--titletext); font-size: 12.5px; font-weight: 600; position: relative; user-select: none; }
  .titlebar .title { position: absolute; left: 70px; right: 70px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .light { width: 12px; height: 12px; border-radius: 50%; border: 0; padding: 0; flex: none; }
  .light.close { background: #ff5f57; } .light.min { background: #febc2e; } .light.zoom { background: #28c840; }
  body.app .device { aspect-ratio: auto; height: auto; max-height: none; padding: 0; border-radius: 11px; overflow: hidden; background: var(--titlebar); }
  body.app .titlebar { display: flex; }
  body.app .screen { border-radius: 0; background: #fff; }
  body.app .screen.input img { cursor: default; }
  body.app .ripple { display: none; }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: #cfd3da; font-size: 13px; padding: 24px; pointer-events: none; background: rgba(0,0,0,.55); white-space: pre-line; }
  .ripple { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; background: rgba(255,255,255,.45); pointer-events: none; animation: ripple .45s ease-out forwards; }
  @keyframes ripple { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
  .banner { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 999px; font-size: 12px; max-width: calc(100% - 32px); }
  aside { width: 420px; max-width: 45vw; border-left: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  aside.hidden { display: none; }
  .tabs { display: flex; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--border); align-items: center; }
  .tabs button { padding: 3px 9px; font-size: 12px; border-radius: 999px; }
  .tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .log { flex: 1; overflow: auto; font: 12px/1.45 var(--mono); padding: 8px 10px; white-space: pre-wrap; word-break: break-word; }
  .line { padding: 1px 0; border-bottom: 1px solid color-mix(in srgb, var(--border) 50%, transparent); }
  .line .tag { display: inline-block; min-width: 38px; color: var(--muted); }
  .line.warn { color: var(--warn); } .line.error { color: var(--err); } .line.debug, .line.bridge { color: var(--muted); }
  .empty { color: var(--muted); padding: 16px 4px; font-family: system-ui, sans-serif; }
  .kbd { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: none; gap: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 6px; box-shadow: var(--shadow); }
  .kbd.show { display: flex; }
  .kbd input { font: inherit; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; width: 260px; background: var(--bg); color: var(--text); }
  @media (max-width: 760px) { aside { display: none; } .device { max-height: 640px; } }
  /* The app's dialogs (they stay off the Mac's screen while the app is in the background). */
  .dlg-layer { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,.28); padding: 16px; z-index: 5; }
  .dlg-layer.sheet { align-items: flex-start; padding-top: 0; }
  .dlg { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); width: min(420px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; outline: none; text-align: left; }
  .dlg-layer.sheet .dlg { border-top-left-radius: 0; border-top-right-radius: 0; border-top: 0; }
  .dlg.files { width: min(640px, 100%); height: min(460px, 100%); }
  .dlg .body { padding: 16px 18px 12px; overflow: auto; display: flex; gap: 12px; }
  .dlg .icon { width: 34px; height: 34px; border-radius: 9px; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 18px; color: #fff; background: var(--accent); }
  .dlg .icon.warning { background: var(--warn); } .dlg .icon.error { background: var(--err); } .dlg .icon.info, .dlg .icon.none { background: var(--muted); }
  .dlg .msg { font-weight: 600; font-size: 14px; margin: 0 0 4px; white-space: pre-wrap; word-break: break-word; }
  .dlg .detail { color: var(--muted); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; margin: 0; }
  .dlg label.check { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12.5px; cursor: pointer; }
  .dlg .foot { display: flex; align-items: center; gap: 8px; padding: 10px 14px 14px; flex-wrap: wrap; }
  .dlg .foot .note { color: var(--muted); font-size: 11.5px; margin-right: auto; }
  .dlg .foot .buttons { display: flex; flex-direction: row-reverse; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .dlg button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dlg .head { padding: 12px 14px 8px; border-bottom: 1px solid var(--border); }
  .dlg .head .t { font-weight: 600; } .dlg .head .m { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .dlg .name { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .dlg .name input, .dlg .pathbar input { flex: 1; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; min-width: 0; }
  .dlg .browser { flex: 1; display: flex; min-height: 0; }
  .dlg .places { width: 128px; flex: none; border-right: 1px solid var(--border); padding: 6px; overflow: auto; }
  .dlg .places button { width: 100%; border: 0; background: none; padding: 5px 8px; font-size: 12.5px; justify-content: flex-start; border-radius: 6px; }
  .dlg .places button.on { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .dlg .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .dlg .pathbar { display: flex; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .dlg .pathbar button { padding: 4px 8px; }
  .dlg .list { flex: 1; overflow: auto; font-size: 12.5px; padding: 4px; outline: none; }
  .dlg .row { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 6px; cursor: default; user-select: none; }
  .dlg .row .n { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dlg .row .d { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .dlg .row.sel { background: var(--accent); color: #fff; } .dlg .row.sel .d { color: rgba(255,255,255,.8); }
  .dlg .row.off { opacity: .4; }
  .dlg .list .empty { padding: 20px; text-align: center; }
  .dlg .err { color: var(--err); font-size: 12px; padding: 4px 14px 0; }
  .dlg .opts { display: flex; align-items: center; gap: 10px; padding: 8px 14px 0; font-size: 12.5px; flex-wrap: wrap; }
  .dlg .opts label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1 id="title">CapMac screen</h1>
  <span class="meta" id="meta">connecting…</span>
  <span class="spacer"></span>
  <select id="win" title="Window" hidden></select>
  <select id="sound" title="Where the app's sound plays" aria-label="Sound" hidden>
    <option value="off">🔇 Sound off</option>
    <option value="mac">🔈 Play on the Mac</option>
    <option value="pc">🔊 Play on this PC</option>
  </select>
  <button id="home" title="Home (H)">⌂ Home</button>
  <button id="lock" title="Lock / side button">⏻</button>
  <button id="type" title="Type text (T)">⌨ Type</button>
  <button id="shot" title="Save screenshot (S)">⤓ Screenshot</button>
  <button id="toggleLogs" title="Show / hide console (L)">☰ Console</button>
</header>
<main>
  <div class="stage" id="stage">
    <div class="device" id="device">
      <div class="titlebar" id="titlebar">
        <button class="light close" id="lightClose" title="Close the window" aria-label="Close the window"></button>
        <button class="light min" id="lightMin" title="Minimize" aria-label="Minimize"></button>
        <button class="light zoom" id="lightZoom" title="Zoom" aria-label="Zoom"></button>
        <span class="title" id="winTitle"></span>
      </div>
      <div class="screen" id="screen" tabindex="0" aria-label="Simulator screen">
        <img id="img" alt="">
        <canvas id="canvas" hidden></canvas>
        <div class="overlay" id="overlay">Connecting…</div>
      </div>
    </div>
    <div class="banner" id="banner" hidden></div>
    <form class="kbd" id="kbd"><input id="kbdText" placeholder="Text to type" autocomplete="off"><button type="submit">Send</button></form>
  </div>
  <aside id="logs">
    <div class="tabs">
      <button data-filter="all" class="active">All</button>
      <button data-filter="js">JS</button>
      <button data-filter="error">Errors</button>
      <span class="spacer"></span>
      <button id="clear">Clear</button>
    </div>
    <div class="log" id="log"><div class="empty">App logs appear here while CapMac is attached.</div></div>
  </aside>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const img = $('img'), screenEl = $('screen'), overlay = $('overlay'), dot = $('dot'), meta = $('meta'), banner = $('banner'), device = $('device');
  let info = null, frames = 0, lastFpsAt = performance.now(), filter = 'all';
  // An Electron app's window (pointer and keyboard), or a simulator (touch).
  let app = false, windows = [], watched = null, waiting = false, ratio = 0;

  // Input goes out one request at a time, in order (a mouse-up must not overtake its mouse-down).
  let queue = Promise.resolve();
  function post(path, body) {
    const run = () => fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) }).then((r) => (r.ok ? r.json().catch(() => ({})) : r.text().then((t) => { throw new Error(t); })));
    queue = queue.then(run, run);
    return queue;
  }

  function setMode(next) {
    if (next === app) return;
    app = next;
    document.body.classList.toggle('app', app);
    screenEl.setAttribute('aria-label', app ? 'App window' : 'Simulator screen');
    $('home').hidden = app;
    $('lock').hidden = app;
    overlay.textContent = app ? 'Waiting for the app…' : 'Connecting to the simulator…';
    layout();
  }

  function applyInfo(next) {
    info = { ...(info || {}), ...next };
    document.title = info.title || 'CapMac screen';
    $('title').textContent = info.title || 'CapMac screen';
    setMode(info.mode === 'app');
    const input = info.screen && info.screen.input;
    const phone = info.mode === 'device';
    screenEl.classList.toggle('input', !!input);
    for (const id of ['home', 'lock', 'type']) {
      $(id).disabled = !input;
      if (phone) $(id).hidden = true;
    }
    if (phone) {
      screenEl.setAttribute('aria-label', 'iPhone screen (view only)');
      if (!framesTotal && !waitingFor && !ended) setOverlay(`Opening ${info.targetName || 'the iPhone'}’s screen…`);
    }
    if (!app && info.screen && !input) {
      banner.hidden = false;
      banner.dataset.kind = 'view-only';
      banner.textContent = phone
        ? 'View only: touch and typing work on simulators. On a real iPhone, use the iPhone itself for now'
        : 'View only — install AXe on the Mac for touch input: capmac doctor --fix';
    } else if (banner.dataset.kind !== 'fallback') banner.hidden = true;
    if (next.windows) setWindows(next.windows, next.watched ?? null);
    if (next.waiting !== undefined) setWaiting(next.waiting);
    if (next.cursor) setCursor(next.cursor);
  }

  async function loadInfo() {
    try {
      applyInfo(await (await fetch('/api/info')).json());
    } catch { /* retry on the next frame */ }
  }

  function setWindows(list, current) {
    windows = list || [];
    watched = current;
    const win = $('win');
    win.hidden = !app || windows.length < 2;
    win.innerHTML = '';
    const follow = document.createElement('option');
    follow.value = ''; follow.textContent = 'Follow the focused window';
    win.appendChild(follow);
    for (const w of windows) {
      const o = document.createElement('option');
      o.value = String(w.id); o.textContent = w.title || `Window ${w.id}`;
      win.appendChild(o);
    }
    const shown = windows.find((w) => w.id === watched);
    $('winTitle').textContent = shown ? shown.title : '';
    if (app && windows.length === 0) setOverlay(waiting ? 'Waiting for the app…' : 'The app has no window open');
    else if (app && !waiting && frames + framesTotal > 0) overlay.style.display = 'none';
  }
  $('win').onchange = () => post('/api/window', { window: $('win').value ? Number($('win').value) : null });

  function setWaiting(value) {
    waiting = value;
    if (app && waiting) setOverlay('Waiting for the app…');
    // A still page sends no new frame: the last one is current again.
    else if (app && windows.length > 0 && framesTotal > 0) overlay.style.display = 'none';
  }
  function setOverlay(text) {
    overlay.textContent = text;
    overlay.style.display = 'flex';
  }

  const CURSORS = { pointer: 'default', hand: 'pointer', text: 'text', wait: 'wait', help: 'help', crosshair: 'crosshair', move: 'move', progress: 'progress', 'not-allowed': 'not-allowed', nodrop: 'no-drop', 'no-drop': 'no-drop', copy: 'copy', alias: 'alias', 'context-menu': 'context-menu', cell: 'cell', 'vertical-text': 'vertical-text', grab: 'grab', grabbing: 'grabbing', 'zoom-in': 'zoom-in', 'zoom-out': 'zoom-out', none: 'none', 'col-resize': 'col-resize', 'row-resize': 'row-resize', 'e-resize': 'e-resize', 'w-resize': 'w-resize', 'n-resize': 'n-resize', 's-resize': 's-resize', 'ne-resize': 'ne-resize', 'nw-resize': 'nw-resize', 'se-resize': 'se-resize', 'sw-resize': 'sw-resize', 'ns-resize': 'ns-resize', 'ew-resize': 'ew-resize', 'nesw-resize': 'nesw-resize', 'nwse-resize': 'nwse-resize', 'all-scroll': 'all-scroll' };
  function setCursor(type) {
    for (const el of [img, canvas]) el.style.cursor = app ? (CURSORS[type] || 'default') : '';
  }

  // The window fits the stage, title bar included.
  function layout() {
    if (!app) {
      device.style.width = device.style.height = '';
      return;
    }
    const stage = $('stage').getBoundingClientRect();
    const bar = 28, pad = 40;
    const r = ratio || 1.5;
    let w = stage.width - pad, h = w / r;
    if (h > stage.height - pad - bar) { h = stage.height - pad - bar; w = h * r; }
    device.style.width = Math.max(120, Math.floor(w)) + 'px';
    device.style.height = Math.max(80, Math.floor(h + bar)) + 'px';
  }
  new ResizeObserver(layout).observe($('stage'));

  let framesTotal = 0;
  function startStream() {
    if (playing !== 'jpeg') return;
    img.hidden = false;
    canvas.hidden = true;
    img.src = '/stream?ts=' + Date.now();
  }

  // The source's picture: JPEG frames on /stream, or the smooth stream (H.264) on /video. It switches
  // when the source does (the smooth stream falling back, or trying again).
  let started = false, playing = null;
  function startScreen() {
    if (started || !info) return;
    started = true;
    play(info.video ? 'video' : 'jpeg');
  }
  function play(mode) {
    if (mode === playing) return;
    playing = mode;
    if (mode === 'video') {
      img.removeAttribute('src');
      startVideo();
    } else {
      stopVideo();
      startStream();
    }
  }
  // Why the compatible stream shows when the smooth one was wanted, and the way back.
  function setFallback(fallback) {
    if (!fallback) {
      if (banner.dataset.kind === 'fallback') { banner.hidden = true; banner.dataset.kind = ''; }
      return;
    }
    banner.hidden = false;
    banner.dataset.kind = 'fallback';
    banner.textContent = 'Compatible stream: ' + fallback.message.replace(/\.$/, '') + ' ';
    const retry = document.createElement('button');
    retry.textContent = 'Try the smooth stream again';
    retry.onclick = () => { setFallback(null); post('/api/retry-smooth').catch(() => undefined); };
    banner.append(retry);
  }

  // ─── The smooth stream: H.264 on /video, decoded here with WebCodecs ────
  // Whatever the viewer's source sends as video. Each message: its u32 length, CapMac's
  // 16-byte header (type, flags, capture time, sequence), then a JSON config (type 1)
  // or one AVCC frame (type 2). Behind on decoding: skip to the next keyframe.
  const canvas = $('canvas');
  let player = null, waitingFor = null, ended = false;
  function startVideo() {
    img.hidden = true;
    canvas.hidden = false;
    if (typeof VideoDecoder === 'undefined') {
      setOverlay('This browser can’t play the smooth stream.\nOpen this page in Chrome or Edge');
      return;
    }
    player = { decoder: null, config: null, needsKey: true, frame: null, ctx: canvas.getContext('2d', { alpha: false, desynchronized: true }), keyAskedAt: 0, abort: new AbortController() };
    readVideo(player);
  }
  function stopVideo() {
    const p = player;
    if (!p) return;
    player = null;
    p.abort.abort();
    try { if (p.decoder && p.decoder.state !== 'closed') p.decoder.close(); } catch {}
    if (p.frame) p.frame.close();
  }
  function askForKeyframe(p) {
    const now = performance.now();
    if (now - p.keyAskedAt < 500) return;
    p.keyAskedAt = now;
    fetch('/api/keyframe', { method: 'POST' }).catch(() => undefined);
  }
  function drawVideo() {
    const f = player && player.frame;
    if (!f) return;
    const dpr = window.devicePixelRatio || 1;
    const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
    if (w > 0 && h > 0 && (canvas.width !== w || canvas.height !== h)) { canvas.width = w; canvas.height = h; }
    player.ctx.imageSmoothingEnabled = true;
    player.ctx.imageSmoothingQuality = 'high';
    // The decoder pads the picture to whole macroblocks: leave the last pixel out, or scaling shows the padding.
    player.ctx.drawImage(f, 0, 0, f.displayWidth - 1, f.displayHeight - 1, 0, 0, canvas.width, canvas.height);
  }
  function newDecoder(p) {
    return new VideoDecoder({
      output: (frame) => {
        if (player !== p) { frame.close(); return; }
        if (p.frame) p.frame.close();
        p.frame = frame;
        drawVideo();
        frames++;
        framesTotal++;
        if (!waitingFor && !ended && !(app && (waiting || windows.length === 0))) overlay.style.display = 'none';
        dot.className = 'dot live';
      },
      error: () => {
        // Start again from the next keyframe.
        p.decoder = null;
        p.needsKey = true;
        if (player === p) askForKeyframe(p);
      },
    });
  }
  function configureVideo(p, c) {
    const bin = atob(c.description), description = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) description[i] = bin.charCodeAt(i);
    if (!p.decoder || p.decoder.state === 'closed') p.decoder = newDecoder(p);
    p.decoder.configure({ codec: c.codec, description, codedWidth: c.width, codedHeight: c.height, hardwareAcceleration: 'prefer-hardware', optimizeForLatency: true });
    p.config = c;
    p.needsKey = true;
    const next = c.width / c.height;
    if (Math.abs(next - ratio) > 0.002) {

      try { await post('/api/dialog/mkdir', { path: join(folder.path, name.replace(/\//g, ':')) }); open(folder.path, name); } catch (err) { showError(String(err.message || err)); }
    } }, 'New folder') : null;
    const cancel = h('button', { type: 'button', onclick: () => finish([]) }, 'Cancel');
    const what = save ? 'Save' : pickDirs && !props.has('openFile') ? 'Choose a folder' : 'Open';
    const card = h('div', { class: 'dlg files', tabindex: '-1', role: 'dialog', 'aria-modal': 'true', 'aria-label': d.title || what },
      h('div', { class: 'head' }, h('div', { class: 't' }, d.title || what), d.message ? h('div', { class: 'm' }, d.message) : null),
      save ? h('div', { class: 'name' }, h('span', {}, d.nameFieldLabel || 'Save as'), nameInput) : null,
      h('div', { class: 'browser' }, places, h('div', { class: 'main' }, h('div', { class: 'pathbar' }, up, pathInput), list)),
      h('div', { class: 'opts' }, filterSelect, h('label', {}, hiddenBox, 'Show hidden files'), newFolder),
      error,
      h('div', { class: 'foot' }, footNote(d), h('div', { class: 'buttons' }, confirmButton, cancel)));
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.preventDefault(); finish([]); }
      else if (e.key === 'Enter' && !(e.target instanceof HTMLButtonElement) && e.target !== pathInput) { e.preventDefault(); confirm(); }
    });
    // Saving: the suggested name, in its folder. Opening: the suggested folder, else the project's.
    const start = d.defaultPath || d.project || '~';
    post('/api/dialog/list', { path: start, hidden }).then((r) => {
      folder = r.data;
      if (save && d.defaultPath && folder.path !== d.defaultPath.replace(/\/+$/, '')) nameInput.value = base(d.defaultPath);
      render();
    }, (err) => { showError(String(err.message || err)); open('~'); });
    return card;
  }

  // ─── The app's sound ─────────────────────────────────────────────────────
  // Off, on the Mac, or here: Opus packets from the app, decoded and played with a small cushion.
  const soundSelect = $('sound');
  let soundMode = null, audio = null;
  function startAudio() {
    if (audio) { if (audio.ctx.state === 'suspended') audio.ctx.resume().catch(() => {}); return; }
    if (typeof AudioDecoder === 'undefined') return;
    const ctx = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
    const state = { ctx, next: 0, ts: 0, decoder: null };
    state.decoder = new AudioDecoder({
      output: (data) => {
        try {
          const ch = data.numberOfChannels, n = data.numberOfFrames;
          const buffer = ctx.createBuffer(ch, n, data.sampleRate);
          if (data.format === 'f32-planar') {
            for (let c = 0; c < ch; c++) { const plane = new Float32Array(n); data.copyTo(plane, { planeIndex: c }); buffer.copyToChannel(plane, c); }
          } else {
            const all = new Float32Array(n * ch); data.copyTo(all, { planeIndex: 0, format: 'f32' });
            for (let c = 0; c < ch; c++) { const plane = new Float32Array(n); for (let i = 0; i < n; i++) plane[i] = all[i * ch + c]; buffer.copyToChannel(plane, c); }
          }
          const now = ctx.currentTime;
          if (state.next < now + 0.01 || state.next > now + 0.72) state.next = now + 0.12;
          const src = ctx.createBufferSource(); src.buffer = buffer; src.connect(ctx.destination); src.start(state.next);
          state.next += buffer.duration;
        } catch {} finally { data.close(); }
      },
      error: () => { stopAudio(); },
    });
    state.decoder.configure({ codec: 'opus', sampleRate: 48000, numberOfChannels: 2 });
    audio = state;
  }
  function stopAudio() {
    if (!audio) return;
    try { audio.decoder.close(); } catch {}
    audio.ctx.close().catch(() => {});
    audio = null;
  }
  function playPackets(packets) {
    if (soundMode !== 'pc') return;
    if (!audio) startAudio();
    if (!audio || audio.decoder.state !== 'configured') return;
    for (const b64 of packets) {
      const bin = atob(b64), data = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) data[i] = bin.charCodeAt(i);
      try { audio.decoder.decode(new EncodedAudioChunk({ type: 'key', timestamp: audio.ts, data })); audio.ts += 20000; } catch {}
    }
  }
  function setSound(next) {
    if (!next) return;
    soundMode = next.mode;
    soundSelect.hidden = !app;
    soundSelect.value = next.mode;
    soundSelect.querySelector('option[value="pc"]').disabled = next.toPc === false;
    if (soundMode === 'pc') startAudio(); else stopAudio();
  }
  soundSelect.onchange = () => {
    // The choice is a click: the page may play sound from now on.
    if (soundSelect.value === 'pc') startAudio();
    post('/api/sound', { mode: soundSelect.value }).catch(() => undefined);
  };
  // Browsers play sound only after a click on the page.
  document.addEventListener('pointerdown', () => { if (soundMode === 'pc') startAudio(); }, true);

  // Window, cursor and clipboard news (app windows).
  const news = new EventSource('/api/events');
  news.onmessage = (m) => {
    let event;
    try { event = JSON.parse(m.data); } catch { return; }
    if (event.type === 'dialogs') setDialogs(event.dialogs);
    else if (event.type === 'audio') { playPackets(event.packets); return; }
    else if (event.type === 'sound') setSound(event);
    if (event.type === 'hello') { applyInfo(event); startScreen(); setFallback(event.fallback); if (event.dialogs) setDialogs(event.dialogs); if (event.sound) setSound(event.sound); }
    else if (event.type === 'codec') {
      // The source switched streams: so does the page.
      if (info) info.video = event.codec === 'h264';
      setFallback(event.fallback);
      if (started) play(event.codec === 'h264' ? 'video' : 'jpeg');
    }
    else if (event.type === 'device-wait') setWaitingFor(event.wait);
    else if (event.type === 'ended') { ended = true; dot.className = 'dot err'; setOverlay(event.message + (event.hint ? '\n' + event.hint : '')); }
    else if (event.type === 'windows') setWindows(event.windows, event.watched);
    else if (event.type === 'waiting') setWaiting(event.waiting);
    else if (event.type === 'cursor') setCursor(event.cursor);
    else if (event.type === 'info') applyInfo({ screen: event.screen });
    else if (event.type === 'clipboard' && document.hasFocus() && navigator.clipboard) navigator.clipboard.writeText(event.text).catch(() => undefined);
  };

  // Console panel (Server-Sent Events).
  const log = $('log');
  const MAX_LINES = 2000;
  const TAGS = { console: 'js', capacitor: 'cap', bridge: '↔', main: 'main', electron: 'elec' };
  function addLine(entry) {
    if (log.firstElementChild && log.firstElementChild.classList.contains('empty')) log.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'line ' + entry.level + ' ' + entry.kind;
    el.dataset.kind = entry.kind; el.dataset.level = entry.level;
    const tag = document.createElement('span'); tag.className = 'tag';
    tag.textContent = TAGS[entry.kind] || 'ios';
    el.append(tag, document.createTextNode(' ' + entry.text));
    applyFilter(el);
    const stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
    log.appendChild(el);
    while (log.childElementCount > MAX_LINES) log.firstElementChild.remove();
    if (stick) log.scrollTop = log.scrollHeight;
  }
  function applyFilter(el) {
    const show = filter === 'all' || (filter === 'js' && el.dataset.kind === 'console') || (filter === 'error' && el.dataset.level === 'error');
    el.style.display = show ? '' : 'none';
  }
  document.querySelectorAll('[data-filter]').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('[data-filter]').forEach((x) => x.classList.remove('active'));
    b.classList.add('active'); filter = b.dataset.filter;
    log.querySelectorAll('.line').forEach(applyFilter);
  }));
  $('clear').onclick = () => { log.innerHTML = ''; };
  const events = new EventSource('/api/logs');
  events.onmessage = (m) => { try { addLine(JSON.parse(m.data)); } catch {} };

  loadInfo().then(startScreen);
})();
</script>
</body>
</html>
