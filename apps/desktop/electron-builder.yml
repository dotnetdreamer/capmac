# capmac Studio for Windows: an installer (per-user by default) and a portable
# exe, for x64 and arm64. npm run desktop:build (builds out/ first).
appId: dev.capmac.studio
productName: CapMac Studio
executableName: CapMac Studio
copyright: Copyright © 2026 capmac contributors

directories:
  output: release/${version}
  buildResources: resources

# Everything the app runs is bundled into out/: no node_modules are shipped.
files:
  - package.json
  - out/**/*
  - '!out/agent/**'
  - '!out/cli/**'
  - '!out/sample/**'
  - '!out/sample-electron/**'
  - '!out/sample-flutter/**'
  - '!out/sample-react-native/**'
  - '!out/remote/**'
  - '!out/mirror-receiver/**'
  - '!**/*.map'
# Outside app.asar: the agent is uploaded to Macs, the sample is copied to Documents,
# the CLI is run by the Node.js in the user's terminals (takeover),
# node-datachannel is a native module (remote access), and the screen receiver is
# a program the engine starts (dist.mjs puts it in out/).
extraResources:
  - from: out/agent
    to: agent
  - from: out/cli
    to: cli
  - from: out/sample
    to: sample
  - from: out/sample-electron
    to: sample-electron
  - from: out/sample-flutter
    to: sample-flutter
  - from: out/sample-react-native
    to: sample-react-native
  # node-datachannel (native) for remote access, for this build's architecture.
  - from: out/remote/${arch}
    to: remote
  # This PC's iPhone screen: UxPlay (GPL-3.0) and the GStreamer parts it uses, with their
  # licenses and SOURCES.txt (packages/core/receiver/build.sh).
  - from: out/mirror-receiver
    to: mirror-receiver
  - from: resources/icons
    to: icons
asar: true
npmRebuild: false
electronLanguages: [en-US]

# Lock the shipped binary down: it only runs this app, as an app.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

win:
  icon: resources/icons/icon.ico
  legalTrademarks: capmac
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  buildUniversalInstaller: false
  artifactName: capmac-studio-${version}-${arch}-setup.${ext}
  shortcutName: CapMac Studio
  uninstallDisplayName: CapMac Studio
  installerIcon: resources/icons/icon.ico
  uninstallerIcon: resources/icons/icon.ico
  runAfterFinish: true
  deleteAppDataOnUninstall: false

portable:
  artifactName: capmac-studio-${version}-${arch}-portable.${ext}
  # One exe per architecture, not an extra one with both.
  buildUniversalInstaller: false
