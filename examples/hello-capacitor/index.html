<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hello capmac</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>Hello from Windows 👋</h1>
      <p class="sub">Built on a Mac, edited on a PC.</p>
      <section class="card">
        <h2>Device</h2>
        <dl id="device"><dt>Loading…</dt></dl>
      </section>
      <section class="card">
        <h2>Counter</h2>
        <button id="count" type="button">Tapped 0 times</button>
      </section>
      <section class="card">
        <h2>Note</h2>
        <input id="note" type="text" placeholder="Type something, then Return" autocomplete="off" autocapitalize="off" enterkeyhint="send" />
        <p id="echo" class="echo">Typing on your PC’s keyboard types here.</p>
      </section>
      <section class="card">
        <h2>List</h2>
        <ol id="list" class="list"></ol>
      </section>
      <p class="hint">Edit <code>src/main.js</code> while <code>capmac dev</code> runs and watch this screen update.</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
