<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hello capmac</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
